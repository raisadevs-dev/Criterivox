name: presentation
description: "Criterivox Flutter presentation layer."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  rive: ^0.14.11
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Add the authored Dharen Rive asset here when the .riv file is available.
  # The renderer has a Flutter fallback so the application remains runnable
  # while the authored asset is being produced.
  assets:
    - assets/characters/
