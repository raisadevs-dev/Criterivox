name: presentation
description: "Criterivox Flutter presentation layer."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.3
  flutter_svg: ^2.3.0
  idb_shim: ^2.9.8
  shared_preferences: ^2.5.5
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Character artwork is authored as vector animation source in Glaxnimate,
  # exported to SVG, and rendered/animated by Flutter.
  assets:
    - assets/characters/
