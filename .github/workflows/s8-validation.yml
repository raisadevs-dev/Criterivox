name: S8 Standalone Validation

on:
  push:
    branches: [s8-xai-evidence-bureau]
  pull_request:
    branches: [s8-xai-evidence-bureau]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: S8 tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests/test_s8_bureau.py tests/test_s8_remaining.py tests/test_s8_research_support.py tests/test_s8_completion.py -q
      - name: Fixtures lab
        env:
          PYTHONPATH: src
        run: python scripts/s8_fixtures_lab.py

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: Dependencies
        working-directory: presentation
        run: flutter pub get
      - name: Analyze
        working-directory: presentation
        run: flutter analyze
      - name: Test
        working-directory: presentation
        run: flutter test
