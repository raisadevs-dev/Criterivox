name: S7 Reasoning Research Bureau Validation

on:
  push:
    branches: [reasoning-research-bureau]
  pull_request:
    branches: [reasoning-research-bureau]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m compileall -q src
      - run: python -m pytest src/criterivox/s7/tests -q
      - name: Smoke-test fixture generator
        run: |
          python tools/research-fixtures/generate.py --non-interactive --scenario reasoning --component Dharen --count 1 --records 3 --hypotheses --contradictory --provenance --formats json,csv
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('tools/research-fixtures/generated/json/reasoning.json')
          fixture = json.loads(path.read_text())
          assert len(fixture) == 1
          item = fixture[0]
          required = {'fixture_id', 'scenario', 'simulated_upstream_component', 'task', 'context', 'provenance', 'synthetic'}
          assert required <= item.keys()
          assert item['synthetic'] is True
          assert len(item['observations']) == 3
          assert len(item['hypotheses']) == 2
          assert len(item['contradictions']) == 1
          assert not item['human_interventions']
          print('Fixture generator smoke test passed')
          PY

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: presentation
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
