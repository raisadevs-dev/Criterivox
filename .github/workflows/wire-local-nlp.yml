name: S7 wire offline NLP
on:
  push:
    branches: [reasoning-research-bureau]
    paths:
      - 'presentation/lib/s7/s7_local_nlp.dart'
      - '.github/workflows/s7-wire-local-nlp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reasoning-research-bureau
      - name: Wire local NLP
        shell: python
        run: |
          from pathlib import Path
          p = Path('presentation/lib/s7/s7_functional_layer.dart')
          s = p.read_text()
          if "import 's7_local_nlp.dart';" not in s:
              s = s.replace("import 'package:flutter/material.dart';", "import 'package:flutter/material.dart';\n\nimport 's7_local_nlp.dart';")
          old = "builder: (_) => const S7DebateArena(),"
          new = "builder: (_) => const S7NlpDebateArena(),"
          s = s.replace(old, new)
          p.write_text(s)
      - name: Commit NLP wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add presentation/lib/s7/s7_functional_layer.dart
          git diff --cached --quiet || git commit -m 'S7: route Debate Arena through offline NLP'
          git push origin reasoning-research-bureau
