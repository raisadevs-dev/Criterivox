name: Criterivox CI

on:
  push:
    branches:
      - main
      - criterivox-refactor
  pull_request:
    branches:
      - main
      - criterivox-refactor

jobs:
  python:
    name: Python runtime and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run pytest
        run: python -m pytest -q

  flutter:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: presentation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
