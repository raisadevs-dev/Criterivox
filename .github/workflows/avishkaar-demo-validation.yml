name: Avishkaar demo data-report validation

on:
  push:
    branches:
      - avishkaar-demo-data-report-layer
    paths:
      - 'src/**'
      - 'tests/**'
      - 'presentation/**'
      - 'src/criterivox/application/global_chat.py'
      - 'packages/avishkaar_demo/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/avishkaar-demo-validation.yml'
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Compile Python
        run: python -m compileall -q src
      - name: Case contract tests
        run: PYTHONPATH=src pytest --import-mode=importlib -q tests/application/test_case_contracts.py
      - name: Relevant application tests
        run: PYTHONPATH=src pytest --import-mode=importlib -q tests/application

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: presentation
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Parse changed Decision Desk file
        run: dart format --output=none lib/human/residence/private_room_page.dart
      - run: flutter analyze
      - run: flutter test
