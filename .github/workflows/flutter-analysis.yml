name: Human Territory Flutter Analysis

on:
  push:
    branches:
      - s6-home03-syvax-bloom-complete
      - human-territory-decision-journey
  pull_request:
    branches:
      - main
      - s6-home03-syvax-bloom-complete
      - human-territory-decision-journey
  workflow_dispatch:

jobs:
  flutter-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test Human Situation strategy routing
        run: python -m pytest tests/application/test_human_situation_support.py -q
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        working-directory: presentation
        run: flutter pub get
      - name: Format Dart sources
        working-directory: presentation
        run: dart format lib test
      - name: Analyze
        working-directory: presentation
        run: flutter analyze
      - name: Tests
        working-directory: presentation
        run: flutter test
