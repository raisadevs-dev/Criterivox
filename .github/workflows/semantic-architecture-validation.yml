name: Semantic Architecture Refactor Validation

on:
  push:
    branches:
      - semantic-architecture-refactor
    paths:
      - 'src/**'
      - 'tests/**'
      - 'presentation/**'
      - 'configs/**'
      - 'data/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/semantic-architecture-validation.yml'
  pull_request:
    branches:
      - semantic-architecture-refactor
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile Python
        run: python -m compileall -q src
      - name: Run Python tests
        run: PYTHONPATH=src pytest --import-mode=importlib -q

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: presentation
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test

