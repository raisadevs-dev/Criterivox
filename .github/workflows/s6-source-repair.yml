name: S6 Source Repair

on:
  push:
    branches:
      - s6-home03-syvax-bloom-complete
    paths:
      - 'presentation/**'
      - 'src/**'
      - 'tests/**'
      - 'start-criterivox.ps1'
      - '.github/workflows/s6-source-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: s6-home03-syvax-bloom-complete
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Repair known malformed Dart expressions
        shell: python
        run: |
          from pathlib import Path

          root = Path('presentation/lib')

          replacements = {
              'home03_syvax_page.dart': [
                  (
                      "setState(()=>{plan=d,rendered=r});",
                      "setState(() {\n        plan = d;\n        rendered = r;\n      });",
                  ),
                  (
                      "rendered?['components']?.toString()??'No rendered output yet.'",
                      "rendered?['components']?.toString() ?? 'No rendered output yet.'",
                  ),
              ],
              'home03_bloom.dart': [
                  ("alpha:active?.32:.10", "alpha: active ? .32 : .10"),
                  ("alpha:active?.32:.08", "alpha: active ? .32 : .08"),
                  ("alpha:active?.18:0", "alpha: active ? .18 : 0"),
                  ("alpha:active?.32", "alpha: active ? .32"),
                  ("alpha:active?.08", "alpha: active ? .08"),
              ],
          }

          for name, pairs in replacements.items():
              path = root / name
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install presentation dependencies
        working-directory: presentation
        run: flutter pub get

      - name: Format Dart source
        working-directory: presentation
        run: dart format lib test

      - name: Compile Python source
        run: python -m compileall -q src tests

      - name: Run targeted Python tests
        run: |
          python -m pytest tests/human/test_collaboration_a_to_g.py -q
          python -m pytest tests/runtime/test_health.py tests/unit/test_app.py -q

      - name: Analyze Flutter source
        working-directory: presentation
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: presentation
        run: flutter test

      - name: Commit formatter and source repairs
        shell: bash
        run: |
          git config user.name 'Criterivox Repair Bot'
          git config user.email 'actions@github.com'
          if git diff --quiet; then
            echo 'No source changes were produced by the repair pass.'
            exit 0
          fi
          git add presentation src tests start-criterivox.ps1
          git commit -m 'fix(s6): format and repair presentation source'
          git push origin HEAD:s6-home03-syvax-bloom-complete
