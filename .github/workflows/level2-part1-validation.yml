name: Level 2 Part-I Validation

on:
  push:
    branches: [ui-stabilization-system-behavior]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'presentation/**'
      - 'docs/ux/CRITERIVOX-WORLD-MAP-LEVEL2-PART1.md'
      - '.github/workflows/level2-part1-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Level 2 runtime tests
        run: python -m pytest tests/test_world_map_level2_part1_runtime.py -q
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter dependencies
        working-directory: presentation
        run: flutter pub get
      - name: Flutter analyze
        working-directory: presentation
        run: flutter analyze
      - name: Flutter tests
        working-directory: presentation
        run: flutter test
