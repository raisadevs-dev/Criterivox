name: S6 Flutter Repair Pass

on:
  push:
    branches:
      - s6-home03-syvax-bloom-complete
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: s6-home03-syvax-bloom-complete
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter dependencies
        working-directory: presentation
        run: flutter pub get

      - name: Format Dart sources and tests
        run: dart format presentation/lib presentation/test

      - name: Apply safe Dart fixes
        working-directory: presentation
        run: dart fix --apply

      - name: Show repair diff
        run: git diff --check && git status --short

      - name: Commit repair changes
        run: |
          if git diff --quiet; then
            echo "No automated repair changes were necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentation
          git commit -m "Repair Flutter formatting and safe analyzer fixes"
          git push origin HEAD:s6-home03-syvax-bloom-complete
