name: S6 targeted repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s6-home03-syvax-bloom-complete
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Repair known generated syntax defects
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/criterivox/application/foundation_runtime_bridge.py')
          s = p.read_text()
          old = "event='S6_ANUKA_ACTIVATED', foundation_id=foundation_id, **common, activity=('Dharen: baseline established', 'Anuka: adaptive context evaluation'))\n"
          new = old[:-2] + "))\n" if old in s else old
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)

          p = Path('src/criterivox/human/collaboration_engine.py')
          s = p.read_text()
          old = '            return self.snapshot(sid, actor)\n\n    def configure('
          new = '            return self.snapshot(sid, mid)\n\n    def configure('
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Python syntax gate
        run: python -m compileall -q src tests
      - name: Flutter dependencies and format
        working-directory: presentation
        run: |
          flutter pub get
          dart format lib test
      - name: Commit repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/criterivox/application/foundation_runtime_bridge.py src/criterivox/human/collaboration_engine.py presentation
          git diff --cached --quiet || git commit -m 'fix: repair S6 runtime syntax and formatting'
          git push origin s6-home03-syvax-bloom-complete
      - name: Flutter analyzer
        working-directory: presentation
        run: flutter analyze
      - name: Flutter tests
        working-directory: presentation
        run: flutter test
      - name: Python tests
        run: python -m pytest -q
