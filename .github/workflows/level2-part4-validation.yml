name: Level 2 Part IV Validation

on:
  push:
    branches:
      - ui-stabilization-system-behavior
  pull_request:
    branches:
      - ui-stabilization-system-behavior

jobs:
  part4-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/test_world_map_level2_part4_runtime.py tests/test_world_map_level2_part3_runtime.py tests/test_world_map_level2_part2_runtime.py tests/test_world_map_level2_part1_runtime.py

  presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: presentation
        run: flutter pub get
      - working-directory: presentation
        run: flutter analyze
      - working-directory: presentation
        run: flutter test
